<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcana vision</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="src/core/style.css">

    <!-- Import Map for Three.js (MediaPipe removed from here) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.146.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-overlay">
        <h1 style="margin-bottom: 20px;">Arcana Vision</h1>
        <p style="margin-bottom: 40px; color: #888;">Mirroring enabled. Move hand to control deck.</p>
        <button id="start-btn">Begin Reading</button>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>THE MAJOR ARCANA</h1>
            <p class="subtitle">Swipe Hand to Unfold &bull; Make Fist to Select</p>
        </header>
        
        <div id="camera-status" title="Camera Status">
            <div class="status-dot" id="status-dot"></div>
        </div>

        <div id="gesture-feedback">
            <div class="gesture-icon">✋</div>
            <div class="instruction-text" id="instruction-label">Show Hand</div>
        </div>

        <div id="reading-display">
            <h2 id="card-name">The Fool</h2>
            <p id="card-meaning">New beginnings, innocence, spontaneity, a free spirit.</p>
        </div>
    </div>

    <!-- 3D Scene Container -->
    <div id="canvas-container"></div>

    <!-- Video Source for Vision -->
    <video id="input-video"></video>

    <!-- MediaPipe Global Scripts (Must load before main.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Application Entry Point -->
    <script type="module" src="src/core/main.js"></script>
</body>
</html>
